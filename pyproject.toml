[project]
name = "trascendence"
version = "0.1.0"
description = "Measurement tooling for functional will in long-lived AI personas: a two-layer charter with validators, a fixed calibration check, drift against baseline variance, two anti-self-grading detectors, a monthly volition review and a week-4 gate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joaquin Diaz Gutierrez de Quijano" }]
dependencies = []
keywords = ["large language models", "ai personas", "agent memory", "evaluation", "ai safety"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/JoaquinDG/trascendence"
Paper = "https://doi.org/10.5281/zenodo.22156501"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
